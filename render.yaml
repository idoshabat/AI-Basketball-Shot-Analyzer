services:
  - type: web
    name: ai-basketball-shot-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        value: https://ai-basketball-shot-analyzer.vercel.app,https://ai-basketball-shot-analyzer-edb2.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app|http://127\.0\.0\.1:5173|http://localhost:5173
