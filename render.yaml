services:
  - type: web
    name: ai-basketball-shot-analyzer-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        value: https://ai-basketball-shot-analyzer-edb2.vercel.app
